name = "steward"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# The production D1 database. Its id is an identifier, not a secret.
[[d1_databases]]
binding = "DB"
database_name = "steward"
database_id = "aa32f5be-6e0f-490c-8246-e83872d97a5e"
migrations_dir = "../../packages/core/drizzle"

[triggers]
crons = ["* * * * *"]

# APP_URL and SLACK_CLIENT_ID are not set here on purpose: a `[vars]` table would overwrite
# production values on every deploy. Locally they come from .dev.vars (see .dev.vars.example);
# in production set them once with `wrangler secret put APP_URL` and `wrangler secret put SLACK_CLIENT_ID`.

# Per-visitor rate limit for the public demo: 60 requests a minute from one address, counted per
# Cloudflare location.
[[ratelimits]]
name = "DEMO_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Workers Logs: the tick's one line a minute and every console.error are kept and searchable.
[observability]
enabled = true
